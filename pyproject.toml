[project]
name = "da360-infer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxsim>=0.8.1",
    "opencv-python>=5.0.0.93",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
